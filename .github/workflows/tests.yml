name: CPU interface and numerical tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==1.12.1+cpu torchvision==0.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/run_full_pipeline.sh
